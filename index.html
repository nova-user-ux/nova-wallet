<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NOVA Wallet</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, #263a7a 0%, transparent 35%),
        radial-gradient(circle at bottom left, #371f67 0%, transparent 35%),
        #080b16;
      color: #fff;
      padding: 20px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      padding: 15px 5px 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 6px;
      color: #9da6bd;
      font-size: 15px;
    }

    .balance {
      padding: 24px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(20px);
      margin-bottom: 22px;
    }

    .balance-label {
      color: #9da6bd;
      font-size: 14px;
    }

    .balance-value {
      margin-top: 8px;
      font-size: 36px;
      font-weight: 800;
    }

    .balance-currency {
      font-size: 17px;
      color: #9da6bd;
      margin-left: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      min-height: 130px;
      padding: 20px;
      border-radius: 22px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .15s ease, background .15s ease;
      cursor: pointer;
    }

    .card:active {
      transform: scale(.96);
      background: rgba(255,255,255,.13);
    }

    .icon {
      font-size: 30px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
    }

    .description {
      margin-top: 4px;
      color: #8f98ad;
      font-size: 12px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 16px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .section {
      padding: 25px;
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .section-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .section-text {
      color: #9da6bd;
      line-height: 1.5;
      font-size: 14px;
    }

    .action {
      width: 100%;
      border: 0;
      margin-top: 20px;
      padding: 15px;
      border-radius: 16px;
      background: #fff;
      color: #080b16;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .action:active {
      transform: scale(.98);
    }

    .footer {
      text-align: center;
      color: #697289;
      font-size: 12px;
      padding: 28px 0 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ГЛАВНАЯ -->
  <div id="home" class="page active">

    <div class="header">
      <div class="logo">NOVA</div>
      <div class="subtitle">Твоя цифровая экосистема</div>
    </div>

    <div class="balance">
      <div class="balance-label">Баланс</div>

      <div class="balance-value">
        0.00
        <span class="balance-currency">NOVA</span>
      </div>
    </div>

    <div class="grid">

      <div class="card" onclick="openPage('messenger')">
        <div class="icon">💬</div>
        <div>
          <div class="title">Messenger</div>
          <div class="description">Общение</div>
        </div>
      </div>

      <div class="card" onclick="openPage('marketplace')">
        <div class="icon">🛍️</div>
        <div>
          <div class="title">Marketplace</div>
          <div class="description">Покупки</div>
        </div>
      </div>

      <div class="card" onclick="openPage('gifts')">
        <div class="icon">🎁</div>
        <div>
          <div class="title">Gifts</div>
          <div class="description">Подарки</div>
        </div>
      </div>

      <div class="card" onclick="openPage('stars')">
        <div class="icon">⭐</div>
        <div>
          <div class="title">Stars</div>
          <div class="description">Telegram Stars</div>
        </div>
      </div>

      <div class="card" onclick="openPage('collectibles')">
        <div class="icon">💎</div>
        <div>
          <div class="title">Collectibles</div>
          <div class="description">Digital Collectibles</div>
        </div>
      </div>

      <div class="card" onclick="openPage('wallet')">
        <div class="icon">💰</div>
        <div>
          <div class="title">Wallet</div>
          <div class="description">Кошелёк</div>
        </div>
      </div>

    </div>

    <div class="footer">
      NOVA Wallet
    </div>

  </div>


  <!-- СТРАНИЦА -->
  <div id="content" class="page">

    <button class="back" onclick="goHome()">← Назад</button>

    <div class="section">

      <div class="section-icon" id="pageIcon">💬</div>

      <div class="section-title" id="pageTitle">
        Messenger
      </div>

      <div class="section-text" id="pageText">
        Раздел NOVA Messenger.
      </div>

      <button class="action" onclick="showMessage()">
        🚀 Скоро будет доступно
      </button>

    </div>

  </div>

</div>


<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  const pages = {

    messenger: {
      icon: "💬",
      title: "Messenger",
      text: "Общайся с другими пользователями NOVA Wallet. Здесь появится полноценный Messenger."
    },

    marketplace: {
      icon: "🛍️",
      title: "Marketplace",
      text: "Покупай и продавай цифровые товары внутри экосистемы NOVA."
    },

    gifts: {
      icon: "🎁",
      title: "Gifts",
      text: "Отправляй подарки друзьям и получай уникальные цифровые подарки."
    },

    stars: {
      icon: "⭐",
      title: "Stars",
      text: "Раздел Telegram Stars. Здесь будет отображаться твой баланс и операции со Stars."
    },

    collectibles: {
      icon: "💎",
      title: "Collectibles",
      text: "Коллекционные цифровые предметы NOVA. Здесь будут отображаться твои коллекции."
    },

    wallet: {
      icon: "💰",
      title: "Wallet",
      text: "Твой NOVA Wallet. Управляй балансом и операциями внутри экосистемы."
    }

  };


  function openPage(pageName) {

    const page = pages[pageName];

    if (!page) return;

    document.getElementById("home").classList.remove("active");
    document.getElementById("content").classList.add("active");

    document.getElementById("pageIcon").textContent = page.icon;
    document.getElementById("pageTitle").textContent = page.title;
    document.getElementById("pageText").textContent = page.text;

    if (tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred("light");
    }

    window.scrollTo(0, 0);
  }


  function goHome() {

    document.getElementById("content").classList.remove("active");
    document.getElementById("home").classList.add("active");

    if (tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred("light");
    }

    window.scrollTo(0, 0);
  }


  function showMessage() {

    if (tg.showAlert) {
      tg.showAlert("Этот раздел пока находится в разработке 🚀");
    } else {
      alert("Этот раздел пока находится в разработке 🚀");
    }

  }

</script>

</body>
</html>
