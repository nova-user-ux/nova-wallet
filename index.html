<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NOVA Wallet</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, #263a7a 0%, transparent 35%),
        radial-gradient(circle at bottom left, #371f67 0%, transparent 35%),
        #080b16;
      color: #ffffff;
      padding: 20px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      padding: 15px 5px 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 6px;
      color: #9da6bd;
      font-size: 15px;
    }

    .balance {
      padding: 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(20px);
      margin-bottom: 22px;
    }

    .balance-label {
      color: #9da6bd;
      font-size: 14px;
    }

    .balance-value {
      margin-top: 8px;
      font-size: 36px;
      font-weight: 800;
    }

    .balance-currency {
      font-size: 17px;
      color: #9da6bd;
      margin-left: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      min-height: 130px;
      padding: 20px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .15s ease;
    }

    .card:active {
      transform: scale(.97);
    }

    .icon {
      font-size: 30px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
    }

    .description {
      margin-top: 4px;
      color: #8f98ad;
      font-size: 12px;
    }

    .footer {
      text-align: center;
      color: #697289;
      font-size: 12px;
      padding: 28px 0 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">NOVA</div>
      <div class="subtitle">Твоя цифровая экосистема</div>
    </div>

    <div class="balance">
      <div class="balance-label">Баланс</div>
      <div class="balance-value">
        0.00
        <span class="balance-currency">NOVA</span>
      </div>
    </div>

    <div class="grid">

      <div class="card">
        <div class="icon">💬</div>
        <div>
          <div class="title">Messenger</div>
          <div class="description">Общение</div>
        </div>
      </div>

      <div class="card">
        <div class="icon">🛍️</div>
        <div>
          <div class="title">Marketplace</div>
          <div class="description">Покупки</div>
        </div>
      </div>

      <div class="card">
        <div class="icon">🎁</div>
        <div>
          <div class="title">Gifts</div>
          <div class="description">Подарки</div>
        </div>
      </div>

      <div class="card">
        <div class="icon">⭐</div>
        <div>
          <div class="title">Stars</div>
          <div class="description">Telegram Stars</div>
        </div>
      </div>

      <div class="card">
        <div class="icon">💎</div>
        <div>
          <div class="title">Collectibles</div>
          <div class="description">Digital Collectibles</div>
        </div>
      </div>

      <div class="card">
        <div class="icon">💰</div>
        <div>
          <div class="title">Wallet</div>
          <div class="description">Кошелёк</div>
        </div>
      </div>

    </div>

    <div class="footer">
      NOVA Wallet · Coming soon
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();
  </script>

</body>
</html>
